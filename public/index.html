<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crown Empire</title>

  <meta
    name="description"
    content="Crown Empire — Premium fashion and anime-inspired products."
  >

  <meta name="theme-color" content="#080808">

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #f4f4f4;
      font-family: Inter, Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(560px, 100%);
      padding: 32px 20px;
      text-align: center;
    }

    .brand {
      color: #d9af48;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .2em;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    p {
      margin: 0;
      color: #aaa;
      line-height: 1.6;
    }

    .card {
      margin-top: 28px;
      padding: 24px;
      background: #111;
      border: 1px solid #252525;
      border-radius: 18px;
    }
  </style>
</head>

<body>

  <main>
    <div class="brand">CROWN EMPIRE</div>

    <div class="card">
      <h1>Premium Fashion</h1>

      <p>
        Discover Crown Empire products and premium anime-inspired
        collections.
      </p>
    </div>
  </main>

</body>
</html>
